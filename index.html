<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Ludo Game Board</title>
    <style>
        /* CSS Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .game-panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            text-align: center;
        }

        /* लूडो बोर्ड का ढांचा */
        .ludo-board {
            width: 450px;
            height: 450px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            border: 5px solid #333;
            margin-bottom: 20px;
            background-color: #fff;
        }

        .home-zone {
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #333;
        }

        /* रंगों के जोन */
        .red-zone { background-color: #ff4d4d; }
        .green-zone { background-color: #2ecc71; }
        .yellow-zone { background-color: #f1c40f; }
        .blue-zone { background-color: #3498db; }

        .center-zone {
            background: linear-gradient(135deg, #ff4d4d 50%, #2ecc71 50%);
            border: 1px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #333;
        }

        .inner-box {
            width: 70%;
            height: 70%;
            background-color: white;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            padding: 5px;
            box-sizing: border-box;
        }

        .token-slot {
            margin: 4px;
            border-radius: 50%;
            border: 2px dashed #999;
        }

        /* पासा (Dice) डिजाइन */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .dice {
            width: 70px;
            height: 70px;
            background-color: #fff;
            color: #333;
            font-size: 2.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #333;
            border-radius: 12px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button {
            padding: 12px 28px;
            font-size: 1.1rem;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #34495e;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #status {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 10px;
        }

        .turn-indicator {
            display: inline-block;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <h1>लूडो गेम बोर्ड</h1>

    <div class="game-panel">
        <!-- लूडो ग्रिड लेआउट -->
        <div class="ludo-board">
            <!-- 1. हरा जोन (Top-Left) -->
            <div class="home-zone green-zone">
                <div class="inner-box">
                    <div class="token-slot" style="background-color: #2ecc71;"></div>
                    <div class="token-slot" style="background-color: #2ecc71;"></div>
                    <div class="token-slot" style="background-color: #2ecc71;"></div>
                    <div class="token-slot" style="background-color: #2ecc71;"></div>
                </div>
            </div>
            
            <!-- 2. रास्ता (Top-Center) -->
            <div class="home-zone" style="background-color: #f9f9f9; font-size: 12px; color: #aaa;">रास्ता</div>
            
            <!-- 3. पीला जोन (Top-Right) -->
            <div class="home-zone yellow-zone">
                <div class="inner-box">
                    <div class="token-slot" style="background-color: #f1c40f;"></div>
                    <div class="token-slot" style="background-color: #f1c40f;"></div>
                    <div class="token-slot" style="background-color: #f1c40f;"></div>
                    <div class="token-slot" style="background-color: #f1c40f;"></div>
                </div>
            </div>

            <!-- 4. रास्ता (Middle-Left) -->
            <div class="home-zone" style="background-color: #f9f9f9; font-size: 12px; color: #aaa;">रास्ता</div>
            
            <!-- 5. होम / सेंटर (Middle-Center) -->
            <div class="center-zone">HOME</div>
            
            <!-- 6. रास्ता (Middle-Right) -->
            <div class="home-zone" style="background-color: #f9f9f9; font-size: 12px; color: #aaa;">रास्ता</div>

            <!-- 7. लाल जोन (Bottom-Left) -->
            <div class="home-zone red-zone">
                <div class="inner-box">
                    <div class="token-slot" style="background-color: #ff4d4d;"></div>
                    <div class="token-slot" style="background-color: #ff4d4d;"></div>
                    <div class="token-slot" style="background-color: #ff4d4d;"></div>
                    <div class="token-slot" style="background-color: #ff4d4d;"></div>
                </div>
            </div>
            
            <!-- 8. रास्ता (Bottom-Center) -->
            <div class="home-zone" style="background-color: #f9f9f9; font-size: 12px; color: #aaa;">रास्ता</div>
            
            <!-- 9. नीला जोन (Bottom-Right) -->
            <div class="home-zone blue-zone">
                <div class="inner-box">
                    <div class="token-slot" style="background-color: #3498db;"></div>
                    <div class="token-slot" style="background-color: #3498db;"></div>
                    <div class="token-slot" style="background-color: #3498db;"></div>
                    <div class="token-slot" style="background-color: #3498db;"></div>
                </div>
            </div>
        </div>

        <!-- गेम कंट्रोल और डाइस -->
        <div class="controls">
            <div id="dice" class="dice">1</div>
            <button id="roll-btn" onclick="rollDice()">पासा रोल करें (Roll)</button>
            <div id="status">
                <span id="indicator" class="turn-indicator" style="background-color: #ff4d4d;"></span>
                <span>लाल खिलाड़ी की बारी है</span>
            </div>
        </div>
    </div>

    <script>
        // JavaScript Logic
        // 4 खिलाड़ियों की मैपिंग और उनके रंग
        const players = [
            { name: "लाल (Red)", color: "#ff4d4d" },
            { name: "हरा (Green)", color: "#2ecc71" },
            { name: "पीला (Yellow)", color: "#f1c40f" },
            { name: "नीला (Blue)", color: "#3498db" }
        ];
        
        let currentPlayerIndex = 0;

        function rollDice() {
            const diceElement = document.getElementById("dice");
            const statusElement = document.getElementById("status");
            const indicator = document.getElementById("indicator");
            const rollButton = document.getElementById("roll-btn");

            // रोलिंग के दौरान बटन बंद करें
            rollButton.disabled = true;
            
            let count = 0;
            // पासा घूमने का एनीमेशन
            const interval = setInterval(() => {
                diceElement.innerText = Math.floor(Math.random() * 6) + 1;
                count++;
                
                if (count > 12) {
                    clearInterval(interval);
                    
                    // फाइनल रैंडम नंबर जेनरेट करें (1 से 6)
                    const diceValue = Math.floor(Math.random() * 6) + 1;
                    diceElement.innerText = diceValue;
                    
                    // स्क्रीन पर स्टेटस अपडेट करें
                    statusElement.innerHTML = `
                        <span class="turn-indicator" style="background-color: ${players[currentPlayerIndex].color}"></span>
                        <span>${players[currentPlayerIndex].name} ने <strong>${diceValue}</strong> फेंका!</span>
                    `;
                    
                    // अगले खिलाड़ी की बारी तय करना
                    currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
                    
                    // 1.5 सेकंड बाद अगले प्लेयर का नाम दिखाना
                    setTimeout(() => {
                        statusElement.innerHTML = `
                            <span class="turn-indicator" style="background-color: ${players[currentPlayerIndex].color}"></span>
                            <span>अब <strong>${players[currentPlayerIndex].name}</strong> की बारी है।</span>
                        `;
                        rollButton.disabled = false;
                    }, 1500);
                }
            }, 60);
        }
    </script>
</body>
</html>
